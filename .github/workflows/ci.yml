# purpose: CI for HybridOps Ansible collection (lint + build sanity).
# adr: ADR-0606-ansible-collections-release-process
# maintainer: HybridOps.Tech

name: hybridops.app CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: collection-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pre-commit ansible-lint

      - name: Prepare collection runtime
        shell: bash
        run: |
          COLLECTIONS_ROOT="${PWD}/.ansible/collections"
          COLLECTIONS_TAIL="${HOME}/.ansible/collections:/usr/share/ansible/collections"

          mkdir -p "${COLLECTIONS_ROOT}/ansible_collections/hybridops"
          ln -sfn "${PWD}" "${COLLECTIONS_ROOT}/ansible_collections/hybridops/app"

          if python - <<'PY'
          import pathlib
          import yaml
          data = yaml.safe_load(pathlib.Path("requirements.yml").read_text()) or {}
          raise SystemExit(0 if data.get("collections") else 1)
          PY
          then
            env -u ANSIBLE_COLLECTIONS_PATHS \
              ANSIBLE_COLLECTIONS_PATH="${COLLECTIONS_ROOT}:${COLLECTIONS_TAIL}" \
              ansible-galaxy collection install -r requirements.yml -p "${COLLECTIONS_ROOT}" --force
          fi

          {
            echo "ANSIBLE_COLLECTIONS_PATH=${COLLECTIONS_ROOT}:${COLLECTIONS_TAIL}"
          } >> "${GITHUB_ENV}"

      - name: Run pre-commit
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          if [ -z "${BASE_SHA}" ] || printf '%s' "${BASE_SHA}" | grep -Eq '^0+$'; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD | tail -n1)"
          fi
          pre-commit run --from-ref "${BASE_SHA}" --to-ref HEAD

      - name: Run ansible-lint on changed Ansible files
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          if [ -z "${BASE_SHA}" ] || printf '%s' "${BASE_SHA}" | grep -Eq '^0+$'; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD | tail -n1)"
          fi
          mapfile -t LINT_TARGETS < <(
            git diff --name-only --diff-filter=ACMR "${BASE_SHA}" HEAD -- \
              galaxy.yml \
              requirements.yml \
              ':(glob)roles/**/*.yml' \
              ':(glob)roles/**/*.yaml' \
            | sort -u
          )
          if [ "${#LINT_TARGETS[@]}" -eq 0 ]; then
            echo "No changed Ansible files to lint."
            exit 0
          fi
          printf 'ansible-lint targets:\n'
          printf '  %s\n' "${LINT_TARGETS[@]}"
          ansible-lint -c .config/linters/ansible-lint.yml "${LINT_TARGETS[@]}"

      - name: Verify local Containerlab image loading
        shell: bash
        run: |
          set -euo pipefail
          test_root="${RUNNER_TEMP}/containerlab-image-test"
          mkdir -p "${test_root}/rootfs"
          printf '%s\n' 'hybridops-containerlab-image-test' > "${test_root}/rootfs/proof"
          tar -C "${test_root}/rootfs" -cf "${test_root}/rootfs.tar" .
          docker import "${test_root}/rootfs.tar" hybridops/containerlab-archive-test:1
          docker save --output "${test_root}/image.tar" hybridops/containerlab-archive-test:1
          docker image rm hybridops/containerlab-archive-test:1
          HYOPS_TEST_IMAGE_ARCHIVE="${test_root}/image.tar" \
            ansible-playbook roles/containerlab_lab/tests/local-image-archive.yml
          docker image inspect hybridops/containerlab-archive-test:1 >/dev/null
          docker image rm hybridops/containerlab-archive-test:1

      - name: Build collection (sanity)
        run: |
          ansible-galaxy collection build --force
