---
- name: Test unchanged GNS3 QEMU image path
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    test_root: /tmp/hybridops-gns3-qemu-test
    test_port: 38081
    test_user: "{{ lookup('env', 'USER') }}"
    test_group: "{{ lookup('pipe', 'id -gn') }}"
    gns3_images_port: "{{ test_port }}"
    gns3_images_username: gns3
    gns3_images_password: test-only-password
    gns3_images_qemu_dir: "{{ test_root }}/images/QEMU"
    gns3_images_iou_dir: "{{ test_root }}/images/IOU"
    gns3_images_cache_dir: "{{ test_root }}/cache"
    gns3_images_iourc_path: "{{ test_root }}/.iourc"
    gns3_images_owner: "{{ test_user }}"
    gns3_images_group: "{{ test_group }}"
    gns3_images_items:
      - name: Test QEMU appliance
        type: qemu
        url: "http://127.0.0.1:{{ test_port }}/test.qcow2"
        filename: test.qcow2
        checksum: sha256:29d6faff44b0ddebacf9eb661c41f1d025562cdd8a2560490d77cefeba2d8af2
        disk_type: hda
      - name: BIGIP-11.6.0.0.0.401.ALL.qcow2.zip
        label: F5 BIG-IP 11.6
        type: qemu
        url: "http://127.0.0.1:{{ test_port }}/BIGIP-11.6.0.0.0.401.ALL.qcow2.zip"

  tasks:
    - name: Clear previous test data
      ansible.builtin.file:
        path: "{{ test_root }}"
        state: absent

    - name: Start mock GNS3 API
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/mock_gns3_api.py"
          - --port
          - "{{ test_port | string }}"
      async: 120
      poll: 0
      changed_when: true
      register: gns3_images_mock_api_job

    - name: Wait for mock GNS3 API
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ test_port }}"
        timeout: 10

    - name: Exercise QEMU image lifecycle
      block:
        - name: Install QEMU fixture
          ansible.builtin.include_role:
            name: hybridops.app.gns3_images

        - name: Reconcile QEMU fixture
          ansible.builtin.include_role:
            name: hybridops.app.gns3_images

        - name: Inspect QEMU image
          ansible.builtin.stat:
            path: "{{ gns3_images_qemu_dir }}/test.qcow2"
          register: gns3_images_test_qemu

        - name: Inspect F5 BIG-IP system disk
          ansible.builtin.stat:
            path: "{{ gns3_images_qemu_dir }}/BIGIP-11.6.0.0.0.401.qcow2"
          register: gns3_images_test_f5_system

        - name: Inspect F5 BIG-IP datastore disk
          ansible.builtin.stat:
            path: >-
              {{ gns3_images_qemu_dir }}/BIGIP-11.6.0.0.0.401.DATASTOR.ALL.qcow2
          register: gns3_images_test_f5_datastore

        - name: Inspect absent IOU licence
          ansible.builtin.stat:
            path: "{{ gns3_images_iourc_path }}"
          register: gns3_images_test_iourc

        - name: Inspect absent IOU image directory
          ansible.builtin.stat:
            path: "{{ gns3_images_iou_dir }}"
          register: gns3_images_test_iou_dir

        - name: Read registered QEMU template
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ test_port }}/v2/templates"
            return_content: true
          register: gns3_images_test_templates

        - name: Require unchanged QEMU behaviour
          ansible.builtin.assert:
            that:
              - gns3_images_test_qemu.stat.isreg
              - gns3_images_test_f5_system.stat.isreg
              - gns3_images_test_f5_datastore.stat.isreg
              - not gns3_images_test_iourc.stat.exists
              - not gns3_images_test_iou_dir.stat.exists
              - gns3_images_test_templates.json | length == 2
              - gns3_images_test_templates.json[0].template_type == 'qemu'
              - >-
                gns3_images_test_templates.json
                | selectattr('name', 'equalto', 'F5 BIG-IP 11.6')
                | map(attribute='hdb_disk_image')
                | first
                == 'BIGIP-11.6.0.0.0.401.DATASTOR.ALL.qcow2'
              - not gns3_images_results.iou_license_ready | bool
      always:
        - name: Stop mock GNS3 API
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ test_port }}/shutdown"
            method: POST
            status_code: 200
          failed_when: false

        - name: Clear mock API job record
          ansible.builtin.async_status:
            jid: "{{ gns3_images_mock_api_job.ansible_job_id }}"
            mode: cleanup

        - name: Remove test data
          ansible.builtin.file:
            path: "{{ test_root }}"
            state: absent
