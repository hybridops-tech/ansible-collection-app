---
gns3_images_port: 3080
gns3_images_username: "gns3"
gns3_images_password: ""
gns3_images_compute_id: "local"
gns3_images_qemu_dir: "/var/lib/gns3/images/QEMU"
gns3_images_iou_dir: "/var/lib/gns3/images/IOU"
gns3_images_cache_dir: "/var/cache/hybridops/gns3-images"
gns3_images_keep_cache: false
gns3_images_iourc_path: "/var/lib/gns3/.iourc"
gns3_images_iourc_content: ""
gns3_images_iou_package: "gns3-iou"
gns3_images_install_iou_runtime: true
gns3_images_owner: "gns3"
gns3_images_group: "gns3"
gns3_images_items: []

gns3_images_template_defaults:
  category: "guest"
  symbol: ":/symbols/qemu_guest.svg"
  platform: "x86_64"
  qemu_path: "/usr/bin/qemu-system-x86_64"
  ram: 512
  cpus: 1
  adapters: 1
  adapter_type: "virtio-net-pci"
  console_type: "telnet"
  hda_disk_interface: "virtio"
  hdb_disk_interface: "virtio"
  linked_clone: true

gns3_images_iou_template_defaults:
  category: "router"
  symbol: ":/symbols/multilayer_switch.svg"
  ram: 1024
  nvram: 256
  ethernet_adapters: 2
  serial_adapters: 0
  console_type: "telnet"
  use_default_iou_values: false
