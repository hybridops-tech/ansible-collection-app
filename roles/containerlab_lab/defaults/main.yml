---
containerlab_lab_action: validate
# Either provide an already-remote topology path, or provide a controller-side
# source directory plus the topology path relative to that directory.
containerlab_lab_topology_path: ""
containerlab_lab_source_dir: ""
containerlab_lab_topology_relpath: ""
containerlab_lab_remote_dir: /var/lib/hybridops/containerlab/labs/managed
# Keep Containerlab-generated clab-* artifacts outside the authoritative source
# tree so source preservation does not implicitly absorb native runtime state.
containerlab_lab_labdir_base: /var/lib/hybridops/containerlab/labdirs
containerlab_lab_restore_all_dir: ""
containerlab_lab_cleanup: false
# Dedicated managed hosts may destroy every Containerlab lab natively without
# relying on a remembered topology path from an earlier restored bundle.
containerlab_lab_destroy_all: false
containerlab_lab_save_copy_dir: ""
containerlab_lab_snapshot_output_dir: ""
containerlab_lab_snapshot_node_filter: ""
containerlab_lab_snapshot_timeout: 5m
containerlab_lab_required_images: []
containerlab_lab_pull_missing_images: false
containerlab_lab_local_image_archives: []
containerlab_lab_image_cache_dir: /var/cache/hybridops/containerlab/images
# Standard IOL-XE binary and OCI archive names are detected in this
# controller-side directory. CML image-definition YAML remains supported.
containerlab_lab_local_image_dir: ""
containerlab_lab_local_image_dir_authorised_use: false
containerlab_lab_local_image_builds: []
containerlab_lab_image_build_root: /var/cache/hybridops/containerlab/builds
containerlab_lab_image_build_timeout_s: 3600
containerlab_lab_image_build_poll_s: 15
containerlab_lab_vrnetlab_repository: https://github.com/srl-labs/vrnetlab.git
containerlab_lab_vrnetlab_revision: 3a34fa63d73843c871f248e2df2ffa5c038183ce
containerlab_lab_disable_version_check: true
