---
- name: Resolve effective Containerlab lab inputs
  ansible.builtin.set_fact:
    _containerlab_lab_effective_action: >-
      {{ _containerlab_lab_action | default(containerlab_lab_action, true) }}
    _containerlab_lab_effective_destroy_all: >-
      {{ _containerlab_lab_destroy_all | default(containerlab_lab_destroy_all, true) }}
    _containerlab_lab_effective_source_dir: >-
      {{
        _containerlab_lab_source_dir
        if _containerlab_lab_source_dir is defined
        else containerlab_lab_source_dir
      }}
    _containerlab_lab_effective_topology_path_input: >-
      {{
        _containerlab_lab_topology_path
        if _containerlab_lab_topology_path is defined
        else containerlab_lab_topology_path
      }}
    _containerlab_lab_effective_restore_all_dir: >-
      {{
        _containerlab_lab_restore_all_dir
        if _containerlab_lab_restore_all_dir is defined
        else containerlab_lab_restore_all_dir
      }}
    _containerlab_lab_effective_required_images: >-
      {{
        _containerlab_lab_required_images
        if _containerlab_lab_required_images is defined
        else containerlab_lab_required_images
      }}

- name: Validate Containerlab lab inputs
  ansible.builtin.assert:
    that:
      - >-
        _containerlab_lab_effective_action in
        ['validate', 'deploy', 'inspect', 'destroy', 'redeploy', 'save', 'snapshot-save']
      - containerlab_lab_labdir_base | length > 0
      - containerlab_lab_remote_owner | length > 0
      - containerlab_lab_remote_owner is match('^[a-z_][a-z0-9_-]{0,31}$')
      - >-
        (_containerlab_lab_effective_action == 'destroy' and
         _containerlab_lab_effective_destroy_all | bool) or
        (_containerlab_lab_effective_source_dir | length > 0 and
         containerlab_lab_topology_relpath | length > 0) or
        (_containerlab_lab_effective_topology_path_input | length > 0)
    fail_msg: >-
      A supported Containerlab action, a native labdir base, and either an
      already-remote topology path, a controller-side source directory plus
      topology relative path, or the explicit dedicated-host destroy-all policy
      are required.

- name: Validate Containerlab image source mode
  ansible.builtin.assert:
    that:
      - >-
        containerlab_lab_local_image_dir | length == 0 or
        containerlab_lab_local_image_builds | length == 0
    fail_msg: >-
      Use either image-directory discovery or explicit local image build
      declarations, not both.

- name: Validate staged topology path is relative
  ansible.builtin.assert:
    that:
      - not (containerlab_lab_topology_relpath | regex_search('^/'))
      - "'..' not in containerlab_lab_topology_relpath.split('/')"
    fail_msg: "containerlab_lab_topology_relpath must stay within the staged source directory."
  when: _containerlab_lab_effective_source_dir | length > 0

- name: Create managed Containerlab lab directory
  ansible.builtin.file:
    path: "{{ containerlab_lab_remote_dir }}"
    state: directory
    owner: "{{ containerlab_lab_remote_owner }}"
    mode: "0750"
  when: _containerlab_lab_effective_source_dir | length > 0

- name: Create native Containerlab generated-lab base
  ansible.builtin.file:
    path: "{{ containerlab_lab_labdir_base }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Stage unchanged Containerlab lab source tree
  ansible.builtin.copy:
    src: "{{ _containerlab_lab_effective_source_dir | regex_replace('/+$', '') }}/"
    dest: "{{ containerlab_lab_remote_dir | regex_replace('/+$', '') }}/"
    owner: "{{ containerlab_lab_remote_owner }}"
    mode: preserve
  when: _containerlab_lab_effective_source_dir | length > 0

- name: Resolve effective Containerlab topology path
  ansible.builtin.set_fact:
    containerlab_lab_effective_topology_path: >-
      {{
        (containerlab_lab_remote_dir | regex_replace('/+$', '')) ~ '/' ~ containerlab_lab_topology_relpath
        if _containerlab_lab_effective_source_dir | length > 0
        else _containerlab_lab_effective_topology_path_input
      }}
  when: >-
    not (_containerlab_lab_effective_action == 'destroy' and
         _containerlab_lab_effective_destroy_all | bool)

- name: Read Containerlab topology state
  ansible.builtin.stat:
    path: "{{ containerlab_lab_effective_topology_path }}"
  register: containerlab_lab_topology
  when: >-
    not (_containerlab_lab_effective_action == 'destroy' and
         _containerlab_lab_effective_destroy_all | bool)

- name: Verify Containerlab topology exists
  ansible.builtin.assert:
    that:
      - containerlab_lab_topology.stat.exists
      - containerlab_lab_topology.stat.isreg
    fail_msg: "Containerlab topology does not exist at {{ containerlab_lab_effective_topology_path }}."
  when: >-
    not (_containerlab_lab_effective_action == 'destroy' and
         _containerlab_lab_effective_destroy_all | bool)

- name: Create local image archive cache
  ansible.builtin.file:
    path: "{{ containerlab_lab_image_cache_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when:
    - containerlab_lab_local_image_archives | length > 0
    - _containerlab_lab_effective_action in ['deploy', 'redeploy']

- name: Resolve local image archives
  ansible.builtin.include_tasks: local-image-archive.yml
  loop: "{{ containerlab_lab_local_image_archives }}"
  loop_control:
    loop_var: containerlab_lab_local_image_archive
    label: >-
      {{ containerlab_lab_local_image_archive.image
         | default(containerlab_lab_local_image_archive.path | default('invalid')) }}
  when: _containerlab_lab_effective_action in ['deploy', 'redeploy']

- name: Initialise local image build state
  ansible.builtin.set_fact:
    containerlab_lab_discovered_image_builds: []
    containerlab_lab_local_image_build_results: []
    containerlab_lab_command_environment:
      CLAB_VERSION_CHECK: >-
        {{ 'disable' if containerlab_lab_disable_version_check | bool else '' }}
      CLAB_LABDIR_BASE: "{{ containerlab_lab_labdir_base }}"

- name: Discover local Containerlab image sources
  ansible.builtin.include_tasks: local-image-discovery.yml
  when:
    - containerlab_lab_local_image_dir | length > 0
    - >-
      not (_containerlab_lab_effective_action == 'destroy' and
           _containerlab_lab_effective_destroy_all | bool)

- name: Resolve effective local image builds
  ansible.builtin.set_fact:
    containerlab_lab_effective_image_builds: >-
      {{
        containerlab_lab_local_image_builds
        + containerlab_lab_discovered_image_builds
      }}

- name: Bind uniquely discovered IOL images to the topology
  ansible.builtin.set_fact:
    containerlab_lab_command_environment: >-
      {{
        containerlab_lab_command_environment
        | combine({
            ('HYOPS_CONTAINERLAB_IOL_L2_IMAGE'
             if item.type | default('l3') == 'l2'
             else 'HYOPS_CONTAINERLAB_IOL_L3_IMAGE'):
            'vrnetlab/cisco_iol:'
            ~ ('L2-' if item.type | default('l3') == 'l2' else '')
            ~ item.version
          })
      }}
  loop: "{{ containerlab_lab_effective_image_builds }}"
  loop_control:
    label: "{{ item.type | default('l3') }} {{ item.version }}"
  when:
    - >-
      containerlab_lab_effective_image_builds
      | selectattr('type', 'equalto', item.type | default('l3'))
      | list | length == 1

- name: Build local Containerlab images
  ansible.builtin.include_tasks: local-image-build.yml
  loop: "{{ containerlab_lab_effective_image_builds }}"
  loop_control:
    loop_var: containerlab_lab_local_image_build
    label: "{{ containerlab_lab_local_image_build.version | default('invalid') }}"
  when: _containerlab_lab_effective_action in ['deploy', 'redeploy']

- name: Resolve effective required images
  ansible.builtin.set_fact:
    containerlab_lab_effective_required_images: >-
      {{
        (_containerlab_lab_effective_required_images
         + (containerlab_lab_local_image_build_results
            | map(attribute='image') | list))
        | unique | list
      }}

- name: Inspect required local images
  ansible.builtin.command:
    argv:
      - docker
      - image
      - inspect
      - "{{ item }}"
  loop: "{{ containerlab_lab_effective_required_images }}"
  register: containerlab_lab_image_inspect_initial
  changed_when: false
  failed_when: false
  when:
    - containerlab_lab_effective_required_images | length > 0
    - _containerlab_lab_effective_action != 'destroy'

- name: Pull missing required images when allowed
  ansible.builtin.command:
    argv:
      - docker
      - pull
      - "{{ item.item }}"
  loop: "{{ containerlab_lab_image_inspect_initial.results | default([]) }}"
  when:
    - containerlab_lab_pull_missing_images | bool
    - item.rc != 0
  changed_when: true

- name: Recheck required images
  ansible.builtin.command:
    argv:
      - docker
      - image
      - inspect
      - "{{ item }}"
  loop: "{{ containerlab_lab_effective_required_images }}"
  register: containerlab_lab_image_inspect_final
  changed_when: false
  failed_when: false
  when:
    - containerlab_lab_effective_required_images | length > 0
    - _containerlab_lab_effective_action != 'destroy'

- name: Verify required images are available
  ansible.builtin.assert:
    that:
      - >-
        containerlab_lab_image_inspect_final.results
        | selectattr('rc', 'ne', 0)
        | list
        | length == 0
    fail_msg: >-
      One or more declared Containerlab images are unavailable. HybridOps does
      not redistribute proprietary NOS images; make the referenced image
      available through the local image store or an authenticated registry.
  when:
    - containerlab_lab_effective_required_images | length > 0
    - _containerlab_lab_effective_action != 'destroy'

- name: Validate Containerlab topology natively
  ansible.builtin.command:
    argv:
      - containerlab
      - validate
      - -t
      - "{{ containerlab_lab_effective_topology_path }}"
  environment: "{{ containerlab_lab_command_environment }}"
  register: containerlab_lab_command
  changed_when: false
  when: _containerlab_lab_effective_action == 'validate'

- name: Deploy or converge Containerlab topology natively
  ansible.builtin.command:
    argv: >-
      {{ ['containerlab', 'deploy', '-t', containerlab_lab_effective_topology_path]
         + (['--restore-all', _containerlab_lab_effective_restore_all_dir]
            if _containerlab_lab_effective_restore_all_dir | length > 0 else []) }}
  environment: "{{ containerlab_lab_command_environment }}"
  register: containerlab_lab_command
  changed_when: true
  when: _containerlab_lab_effective_action == 'deploy'

- name: Inspect Containerlab topology natively
  ansible.builtin.command:
    argv:
      - containerlab
      - inspect
      - -t
      - "{{ containerlab_lab_effective_topology_path }}"
      - -f
      - json
  environment: "{{ containerlab_lab_command_environment }}"
  register: containerlab_lab_command
  changed_when: false
  when: _containerlab_lab_effective_action == 'inspect'

- name: Destroy all Containerlab labs natively on dedicated host
  ansible.builtin.command:
    argv:
      - containerlab
      - destroy
      - --all
      - --yes
  environment: "{{ containerlab_lab_command_environment }}"
  register: containerlab_lab_command
  changed_when: true
  when:
    - _containerlab_lab_effective_action == 'destroy'
    - _containerlab_lab_effective_destroy_all | bool

- name: Destroy Containerlab topology natively
  ansible.builtin.command:
    argv: >-
      {{ ['containerlab', 'destroy', '-t', containerlab_lab_effective_topology_path]
         + (['--cleanup'] if containerlab_lab_cleanup | bool else []) }}
  environment: "{{ containerlab_lab_command_environment }}"
  register: containerlab_lab_command
  changed_when: true
  when:
    - _containerlab_lab_effective_action == 'destroy'
    - not (_containerlab_lab_effective_destroy_all | bool)

- name: Redeploy Containerlab topology natively
  ansible.builtin.command:
    argv:
      - containerlab
      - redeploy
      - -t
      - "{{ containerlab_lab_effective_topology_path }}"
  environment: "{{ containerlab_lab_command_environment }}"
  register: containerlab_lab_command
  changed_when: true
  when: _containerlab_lab_effective_action == 'redeploy'

- name: Validate configuration-save destination
  ansible.builtin.assert:
    that:
      - containerlab_lab_save_copy_dir | length > 0
    fail_msg: "containerlab_lab_save_copy_dir is required for the save action."
  when: _containerlab_lab_effective_action == 'save'

- name: Create configuration-save destination
  ansible.builtin.file:
    path: "{{ containerlab_lab_save_copy_dir }}"
    state: directory
    mode: "0750"
  when: _containerlab_lab_effective_action == 'save'

- name: Save and copy native Containerlab configurations
  ansible.builtin.command:
    argv:
      - containerlab
      - save
      - -t
      - "{{ containerlab_lab_effective_topology_path }}"
      - --copy
      - "{{ containerlab_lab_save_copy_dir }}"
  environment: "{{ containerlab_lab_command_environment }}"
  register: containerlab_lab_command
  changed_when: true
  when: _containerlab_lab_effective_action == 'save'

- name: Validate snapshot destination
  ansible.builtin.assert:
    that:
      - containerlab_lab_snapshot_output_dir | length > 0
    fail_msg: "containerlab_lab_snapshot_output_dir is required for snapshot-save."
  when: _containerlab_lab_effective_action == 'snapshot-save'

- name: Create snapshot destination
  ansible.builtin.file:
    path: "{{ containerlab_lab_snapshot_output_dir }}"
    state: directory
    mode: "0750"
  when: _containerlab_lab_effective_action == 'snapshot-save'

- name: Save native vrnetlab snapshots
  ansible.builtin.command:
    argv: >-
      {{ ['containerlab', 'tools', 'snapshot', 'save', '-t', containerlab_lab_effective_topology_path,
          '--output-dir', containerlab_lab_snapshot_output_dir,
          '--timeout', containerlab_lab_snapshot_timeout, '--format', 'json']
         + (['--node-filter', containerlab_lab_snapshot_node_filter]
            if containerlab_lab_snapshot_node_filter | length > 0 else []) }}
  environment: "{{ containerlab_lab_command_environment }}"
  register: containerlab_lab_command
  changed_when: true
  when: _containerlab_lab_effective_action == 'snapshot-save'

- name: Publish Containerlab lab action result
  ansible.builtin.set_fact:
    containerlab_lab_result:
      action: "{{ _containerlab_lab_effective_action }}"
      topology: "{{ containerlab_lab_effective_topology_path | default('') }}"
      source_staged: "{{ _containerlab_lab_effective_source_dir | length > 0 }}"
      labdir_base: "{{ containerlab_lab_labdir_base }}"
      destroy_all: "{{ _containerlab_lab_effective_destroy_all | bool }}"
      rc: "{{ containerlab_lab_command.rc | default(0) }}"
      stdout: "{{ containerlab_lab_command.stdout | default('') }}"
      stderr: "{{ containerlab_lab_command.stderr | default('') }}"
      restore_all_dir: "{{ _containerlab_lab_effective_restore_all_dir }}"
      local_images: "{{ containerlab_lab_local_image_results | default([]) }}"
      local_image_builds: "{{ containerlab_lab_local_image_build_results | default([]) }}"
