---
- name: Reject protected runtime and evidence path overlap
  block:
    - name: Execute fixture with protected path overlap
      ansible.builtin.include_role:
        name: hybridops.app.pinned_workload
      vars:
        pinned_workload_id: "overlap-{{ overlap_case.name }}"
        pinned_workload_repository: "file://{{ fixture_repo }}"
        pinned_workload_revision: "{{ fixture_commit.stdout | trim }}"
        pinned_workload_checkout_root: "{{ checkout_root }}"
        pinned_workload_owner: "{{ lookup('env', 'USER') }}"
        pinned_workload_entrypoint: run.sh
        pinned_workload_runtime_files:
          - src: "{{ runtime_source }}"
            dest: "{{ overlap_case.runtime_path }}"
        pinned_workload_evidence_paths:
          - "{{ overlap_case.evidence_path }}"
        pinned_workload_controller_evidence_dir: "{{ evidence_root }}"
        pinned_workload_timeout_s: 60

    - name: Reject unexpected protected path overlap success
      ansible.builtin.fail:
        msg: "Protected path overlap was unexpectedly accepted."

  rescue:
    - name: Require protected path overlap rejection
      ansible.builtin.assert:
        that:
          - >-
            ansible_failed_task.name ==
            'Separate protected runtime files from retained evidence'
