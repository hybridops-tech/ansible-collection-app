---
- name: Refresh GNS3 apt metadata
  ansible.builtin.apt:
    update_cache: true

- name: Restart GNS3 server
  ansible.builtin.systemd:
    name: gns3server
    state: restarted
    daemon_reload: true

- name: Restart GNS3 management bridge
  listen: Restart GNS3 management access
  ansible.builtin.systemd:
    name: hybridops-gns3-management.service
    state: restarted
    daemon_reload: true

- name: Restart isolated dnsmasq for GNS3 management
  listen: Restart GNS3 management dnsmasq
  ansible.builtin.systemd:
    name: hybridops-gns3-dnsmasq.service
    state: restarted
    daemon_reload: true

- name: Restart OpenSSH for GNS3 management
  listen: Restart GNS3 management sshd
  ansible.builtin.systemd:
    name: ssh
    state: restarted
