---
# purpose: Ansible Galaxy metadata for hybridops.app collection
# adr: ADR-0606-ansible-collections-release-process
# maintainer: HybridOps.Tech

namespace: hybridops
name: app
version: "0.1.9"

readme: README.md
description: >-
  Application and platform roles for HybridOps, including Jenkins, RKE2,
  NetBox, Moodle, and core Linux/Windows services.

authors:
  - HybridOps.Tech

license:
  - MIT-0

tags:
  - hybridops
  - platform
  - automation
  - jenkins
  - rke2
  - netbox
  - moodle
  - linux
  - windows
  - kubernetes
  - k8s
  - postgresql
  - patroni
  - argocd
  - proxmox

homepage: https://hybridops.tech
documentation: https://docs.hybridops.tech
repository: https://galaxy.ansible.com/hybridops/app
issues: https://hybridops.tech/contact

dependencies:
  hybridops.common: ">=0.1.0"
  hybridops.helper: ">=0.1.6"

build_ignore:
  - .git
  - .gitignore
  - .github
  - .ansible
  - .config/linters/.ansible
  - .config/linters/.ansible/**
  - .tox
  - .venv
  - "*.tar.gz"
  - build
  - dist
  - output
  - roles/*/.github
  - roles/*/.github/**
  - roles/*/.showcase
  - roles/*/.showcase/**
  - roles/*/tests/output
  - roles/*/tests/output/**
  - roles/*/tests/outputs
  - roles/*/tests/outputs/**
  - tests/output
  - tests/output/**
  - tests/outputs
  - tests/outputs/**
  - __pycache__
  - .mypy_cache
  - .pytest_cache
